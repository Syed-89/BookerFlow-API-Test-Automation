# Shared defaults. Environment files (qa.properties, ...) override these.
# Anything can also be overridden by -Dkey=value or an env var (AUTH_PASSWORD -> auth.password).
base.url=http://localhost:8080

# TOKEN (cookie token from POST /auth) | BASIC (Authorization: Basic ...) | NONE
auth.type=TOKEN
auth.username=admin
auth.password=password123
auth.token.ttl.seconds=540

http.connection.timeout.ms=10000
http.socket.timeout.ms=30000

# Client-level retry for idempotent calls on 502/503/504 (Heroku cold starts)
retry.max.attempts=3
retry.delay.ms=1000

# Test-level retry (TestNG IRetryAnalyzer)
test.retry.count=1

# Delete bookings created by the run at the end of the suite
cleanup.enabled=true
